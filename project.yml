name: SuiviAuto
options:
  bundleIdPrefix: fr.glecomte
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  SuiviAuto:
    type: application
    platform: macOS
    sources:
      - SuiviAuto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.glecomte.SuiviAuto
        PRODUCT_NAME: SuiviAuto
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SuiviAuto
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CFBundleDevelopmentRegion: fr
        DEVELOPMENT_LANGUAGE: fr
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SuiviAutoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SuiviAutoTests
    dependencies:
      - target: SuiviAuto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fr.glecomte.SuiviAutoTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SuiviAuto.app/Contents/MacOS/SuiviAuto"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SuiviAuto:
    build:
      targets:
        SuiviAuto: all
        SuiviAutoTests: [test]
    test:
      targets:
        - SuiviAutoTests
