name: 💡 Proposer une idée
description: Une fonctionnalité ou une amélioration pour SuiviAuto
title: "[Idée] "
labels: ["idée"]
body:
  - type: textarea
    id: besoin
    attributes:
      label: Quel est votre besoin ?
      description: Ce que vous aimeriez pouvoir faire, et pourquoi.
      placeholder: "Ex. : suivre les pleins de carburant pour connaître ma consommation."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Comment l'imaginez-vous ?
      description: Facultatif : à quoi cela pourrait ressembler dans l'app.
